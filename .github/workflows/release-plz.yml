# .github/workflows/release-plz.yml
# Semantic release orchestration using reusable workflows.
# Chains asset build/release automatically when a new version is published.

name: Semantic Release (release-plz)

on:
  push:
    branches:
      - main
      - ci
    paths-ignore:
      - 'bck/**'
      - 'bash/**'
      - '.github/**'
      - '.treeclipignore'
      - '.gitignore'
      - 'install.sh'
      - 'install.ps1'
      - 'justfile'
      - 'LICENSE'
      - 'CHANGELOG.md'

jobs:
  release:
    uses: seyallius/github-workflows/.github/workflows/release-plz.yml@v0.4.2
    with:
      branch: main  # Or 'master' if you use that
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Auto-chain assets on successful release
  debug:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Debug outputs
        run: |
          echo "GITHUB_REF_NAME: ${{ github.ref_name }}"
          echo "Release created output: ${{ needs.release.outputs.release_created }}"
          echo "Tag name output: ${{ needs.release.outputs.tag_name }}"

  build-assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'  # Check the boolean output from the release-plz job
    uses: seyallius/github-workflows/.github/workflows/build-assets.yml@v0.4.4
    with:
      binary_name: govmr
      version: ${{ needs.release.outputs.tag_name }}   # Pass the actual tag

  publish-assets:
    needs: [release, build-assets]
    if: needs.release.outputs.release_created == 'true'  # Check the boolean output from the release-plz job
    uses: seyallius/github-workflows/.github/workflows/release-assets.yml@v0.4.4
    with:
      artifact_pattern: govmr*
      generate_release_notes: true
      tag_name: ${{ needs.release.outputs.tag_name }}
      fail_on_failure: false