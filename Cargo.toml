[package]
name = "govm"
version = "0.1.1"
edition = "2024"

[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0.20"

# Async runtime
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP client
reqwest = { version = "0.13.4", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Archive formats
flate2 = "1.0"
tar = "0.4"
zip = "8.6.0"

# Filesystem and paths
dirs = "6.0.0"

# Version parsing
semver = "1.0"

# Progress bars
indicatif = "0.18.6"
