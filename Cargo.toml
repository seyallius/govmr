[package]
name = "govmr"
version = "0.1.7"
edition = "2024"
authors = ["Seyed Ali <seyed.ali.devl@gmail.com>"]
description = "A high-performance, asynchronous Go Version Manager with a slick terminal UI."
repository = "https://github.com/seyallius/govmr"
homepage = "https://github.com/seyallius/govmr"
documentation = "https://docs.rs/govmr"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["go", "golang", "version-manager", "tui", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization & Parsing
serde = { version = "1.0", features = ["derive"] }

# Terminal UI & CLI Parsing
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

# Archive Extraction & Filesystem Utilities
flate2 = "1.0"
tar = "0.4"
zip = "2.1"
dirs = "5.0"
futures-util = "0.3.34"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
